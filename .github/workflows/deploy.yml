name: Deploy to cPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
         CI: false
      - name: Copy build to repo folder on server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/"
          target: "/home/goregeno/algoldherbs.com/repo/"

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment copy..."
            # Remove old Index.html (with capital I) if exists to avoid filename collisions (Linux is case-sensitive)
            if [ -f /home/goregeno/algoldherbs.com/Index.html ]; then
              rm -f /home/goregeno/algoldherbs.com/Index.html
              echo "Removed old Index.html"
            fi
            # Copy build contents to the domain root directory
            cp -rf /home/goregeno/algoldherbs.com/repo/build/* /home/goregeno/algoldherbs.com/
            echo "Deployment copy completed successfully!"